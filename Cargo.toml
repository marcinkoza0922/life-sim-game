[workspace]
resolver = "3"
members = ["crates/hearth_ecs", "crates/hearth_render", "crates/sim", "crates/game", "crates/simctl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Marcin Koza"]

[workspace.dependencies]
hearth_ecs = { path = "crates/hearth_ecs" }
hearth_render = { path = "crates/hearth_render" }
sim = { path = "crates/sim" }
glam = { version = "0.30", features = ["serde", "bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
bytemuck = { version = "1", features = ["derive"] }
wgpu = "30"
winit = "0.30"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
